<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">Web Page Analyzer architecture</title>
  <desc id="description">Flow from the browser through the HTTP handler and page analyzer to the target page and concurrent link checker worker pool.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28386b"/>
      <stop offset="1" stop-color="#1c284f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e46"/>
      <stop offset="1" stop-color="#123a38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72e0bd"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #f5f7ff; }
      .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #9ca8c8; }
      .node-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #f5f7ff; }
      .node-text { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #b9c4df; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #91f0d0; }
      .node { stroke: #40517f; stroke-width: 2; filter: url(#shadow); }
      .node-accent { stroke: #287f70; stroke-width: 2; filter: url(#shadow); }
      .flow { fill: none; stroke: #72e0bd; stroke-width: 4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #8292cf; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="720" rx="28" fill="url(#background)"/>
  <text x="60" y="66" class="title">Web Page Analyzer</text>
  <text x="60" y="98" class="subtitle">Request, analysis, concurrent link checks, and streamed results</text>

  <rect x="55" y="245" width="250" height="170" rx="20" fill="url(#primary)" class="node"/>
  <text x="180" y="300" text-anchor="middle" class="node-title">Web browser</text>
  <text x="180" y="338" text-anchor="middle" class="node-text">URL form</text>
  <text x="180" y="368" text-anchor="middle" class="node-text">Progress and result table</text>

  <rect x="390" y="245" width="260" height="170" rx="20" fill="url(#primary)" class="node"/>
  <text x="520" y="300" text-anchor="middle" class="node-title">HTTP handler</text>
  <text x="520" y="338" text-anchor="middle" class="node-text">Form and API routes</text>
  <text x="520" y="368" text-anchor="middle" class="node-text">NDJSON progress stream</text>

  <rect x="740" y="145" width="280" height="170" rx="20" fill="url(#accent)" class="node-accent"/>
  <text x="880" y="200" text-anchor="middle" class="node-title">Page analyzer</text>
  <text x="880" y="238" text-anchor="middle" class="node-text">Fetch and parse HTML</text>
  <text x="880" y="268" text-anchor="middle" class="node-text">Title, headings, links, forms</text>

  <rect x="740" y="425" width="280" height="170" rx="20" fill="url(#accent)" class="node-accent"/>
  <text x="880" y="480" text-anchor="middle" class="node-title">Worker pool</text>
  <text x="880" y="518" text-anchor="middle" class="node-text">Up to 20 concurrent workers</text>
  <text x="880" y="548" text-anchor="middle" class="node-text">GET accessibility checks</text>

  <rect x="1110" y="145" width="235" height="170" rx="20" fill="url(#primary)" class="node"/>
  <text x="1227" y="200" text-anchor="middle" class="node-title">Target page</text>
  <text x="1227" y="238" text-anchor="middle" class="node-text">Server-rendered HTML</text>
  <text x="1227" y="268" text-anchor="middle" class="node-text">Redirect destination</text>

  <rect x="1110" y="425" width="235" height="170" rx="20" fill="url(#primary)" class="node"/>
  <text x="1227" y="480" text-anchor="middle" class="node-title">Unique links</text>
  <text x="1227" y="518" text-anchor="middle" class="node-text">HTTP status results</text>
  <text x="1227" y="548" text-anchor="middle" class="node-text">Accessible / inaccessible</text>

  <path d="M305 330 H390" class="flow"/>
  <text x="347" y="315" text-anchor="middle" class="label">Submit URL</text>

  <path d="M650 300 C690 300 700 230 740 230" class="flow"/>
  <text x="688" y="244" text-anchor="middle" class="label">Analyze</text>

  <path d="M1020 230 H1110" class="flow"/>
  <text x="1065" y="214" text-anchor="middle" class="label">GET</text>

  <path d="M880 315 V425" class="flow"/>
  <text x="897" y="375" class="label">Unique URLs</text>

  <path d="M1020 510 H1110" class="flow"/>
  <text x="1065" y="494" text-anchor="middle" class="label">GET range</text>

  <path d="M740 530 C660 530 690 370 650 370" class="return"/>
  <text x="688" y="488" text-anchor="middle" class="label">Progress</text>

  <path d="M390 385 C350 475 275 475 240 415" class="return"/>
  <text x="332" y="484" text-anchor="middle" class="label">Stream results</text>

  <text x="60" y="670" class="subtitle">The analyzer parses one submitted page; the worker pool checks each unique HTTP/HTTPS destination once.</text>
</svg>
