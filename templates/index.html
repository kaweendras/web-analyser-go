<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<title>Web Page Analyzer</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "Segoe UI", sans-serif;
			color: #ededed;
			background: #141414;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			min-height: 100svh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
		}

		main {
			width: 100%;
			max-width: 440px;
		}

		h1 {
			margin: 0 0 32px;
			font-size: 28px;
			font-weight: 600;
		}

		form {
			display: grid;
			gap: 12px;
		}

		label {
			color: #bdbdbd;
			font-size: 14px;
		}

		input,
		button {
			width: 100%;
			min-width: 0;
			min-height: 48px;
			padding: 12px 16px;
			border: 1px solid #454545;
			border-radius: 6px;
			font: inherit;
		}

		input {
			background: #202020;
			color: #ededed;
		}

		input::placeholder {
			color: #909090;
		}

		button {
			margin-top: 8px;
			border-color: transparent;
			background: #b4e3c1;
			color: #14251a;
			font-weight: 600;
			cursor: pointer;
		}

		button:hover {
			background: #c9efd3;
		}

		input:focus-visible,
		button:focus-visible {
			outline: 2px solid #b4e3c1;
			outline-offset: 3px;
		}
	</style>
</head>
<body>
	<main>
		<h1>Web Page Analyzer</h1>
		<form method="post" action="/">
			<label for="url">Web page URL</label>
			<input id="url" name="url" type="url" placeholder="https://example.com" value="{{.URL}}" required>
			<button type="submit">Analyze</button>
		</form>
        {{if .Error}}
        <p role="alert">{{.Error}}</p>
        {{end}}
	</main>
</body>
</html>
